kind = "mobile"
previewPath = "/snifftown-mobile/"
title = "SniffTown Mobile"
description = "A native iPhone companion for Austin dog owners to discover compatible dogs, express private interest, form mutual matches, view dog-first profiles, and message matched neighbors using SniffTown's existing backend."
version = "1.0.0"
id = "artifacts/snifftown-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/snifftown-mobile/" ]
localPort = 20334

[services.development]
run = "pnpm --filter @workspace/snifftown-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/snifftown-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/snifftown-mobile", "run", "serve" ]

[services.env]
PORT = "20334"
BASE_PATH = "/snifftown-mobile/"
