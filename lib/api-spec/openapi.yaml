openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dogs
    description: Nearby dogs and pack membership
  - name: parks
    description: Nearby parks
  - name: packs
    description: Neighborhood packs
  - name: auth
    description: Account access and session management
  - name: contact
    description: Contact messages
  - name: messaging
    description: Private member conversations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dogs:
    get:
      operationId: listDogs
      tags: [dogs]
      summary: List nearby dogs
      parameters:
        - name: parkId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Nearby dogs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dog"
    post:
      operationId: createDog
      tags: [dogs]
      summary: Add a dog to the community
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DogInput"
      responses:
        "201":
          description: Dog created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dog"
        "401":
          description: Authentication required
  /dogs/mine:
    get:
      operationId: getMyDog
      tags: [dogs]
      summary: Get the signed-in member's primary dog
      responses:
        "200":
          description: Primary dog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dog"
        "401":
          description: Authentication required
        "404":
          description: No dog profile found
  /dogs/{dogId}/pack:
    post:
      operationId: addDogToPack
      tags: [dogs]
      summary: Send a pack request to a nearby dog
      parameters:
        - name: dogId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Pack request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRequest"
        "401":
          description: Authentication required
  /parks:
    get:
      operationId: listParks
      tags: [parks]
      summary: List local park packs
      responses:
        "200":
          description: Nearby parks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Park"
  /parks/{parkId}/membership:
    post:
      operationId: updateParkPackMembership
      tags: [parks]
      summary: Join or leave a local park pack
      parameters:
        - name: parkId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParkPackMembershipInput"
      responses:
        "200":
          description: Park pack membership updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkPackMembershipResult"
        "401":
          description: Authentication required
        "404":
          description: Local park pack not found
  /pack-requests/incoming:
    get:
      operationId: listIncomingPackRequests
      tags: [packs]
      summary: List pending pack requests for the signed-in member
      responses:
        "200":
          description: Pending incoming requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IncomingPackRequest"
        "401":
          description: Authentication required
  /pack-requests/{requestId}/response:
    post:
      operationId: respondToPackRequest
      tags: [packs]
      summary: Accept or decline an incoming pack request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackRequestResponseInput"
      responses:
        "200":
          description: Request updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRequestResponse"
        "401":
          description: Authentication required
  /packs:
    get:
      operationId: listPacks
      tags: [packs]
      summary: List public neighborhood packs
      responses:
        "200":
          description: Public neighborhood packs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pack"
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create a SniffTown account
      parameters:
        - $ref: "#/components/parameters/SniffTownClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Invalid credentials or existing account
  /auth/signin:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in to SniffTown
      parameters:
        - $ref: "#/components/parameters/SniffTownClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials
  /auth/signout:
    post:
      operationId: signOut
      tags: [auth]
      summary: Sign out
      responses:
        "204":
          description: Signed out
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Refresh a native SniffTown session
      description: Requests that explicitly opt into the mobile bearer-session representation with X-SniffTown-Client set to mobile receive refreshed tokens.
      parameters:
        - $ref: "#/components/parameters/SniffTownClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionInput"
      responses:
        "200":
          description: Refreshed native session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Invalid refresh request
        "401":
          description: Invalid or expired refresh token
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in user
      responses:
        "200":
          description: Current user or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
  /contact:
    post:
      operationId: sendContactMessage
      tags: [contact]
      summary: Send a message to the SniffTown team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessage"
      responses:
        "202":
          description: Message accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageStatus"
  /conversations:
    get:
      operationId: listConversations
      tags: [messaging]
      summary: List the signed-in member's conversations
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
        "401":
          description: Authentication required
  /conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      tags: [messaging]
      summary: List messages in a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "401":
          description: Authentication required
        "404":
          description: Conversation not found
  /messages:
    post:
      operationId: sendMessage
      tags: [messaging]
      summary: Send a private message to a member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResult"
        "400":
          description: Invalid message
        "401":
          description: Authentication required
  /conversations/{conversationId}/read:
    post:
      operationId: markConversationRead
      tags: [messaging]
      summary: Mark received messages in a conversation as read
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      responses:
        "200":
          description: Conversation marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationReadResult"
        "401":
          description: Authentication required
        "404":
          description: Conversation not found
components:
  parameters:
    SniffTownClient:
      name: X-SniffTown-Client
      in: header
      required: false
      description: Opts a request into the mobile bearer-session response representation.
      schema:
        type: string
        enum: [mobile]
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Dog:
      type: object
      properties:
        id:
          type: string
        ownerId:
          type: string
        name:
          type: string
        ownerName:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        temperament:
          type: array
          items:
            type: string
        parkId:
          type: ["string", "null"]
        isInPack:
          type: boolean
      required: [id, ownerId, name, ownerName, description, photoUrl, temperament, parkId, isInPack]
    DogInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        photoUrl:
          type: string
        temperament:
          type: array
          items:
            type: string
        parkId:
          type: string
      required: [name]
    Park:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        city:
          type: string
        state:
          type: string
        slug:
          type: string
        memberCount:
          type: number
        isMember:
          type: boolean
      required: [id, name, city, state, slug, memberCount, isMember]
    ParkPackMembershipInput:
      type: object
      properties:
        action:
          type: string
          enum: [join, leave]
      required: [action]
    ParkPackMembershipResult:
      type: object
      properties:
        parkId:
          type: string
        isMember:
          type: boolean
      required: [parkId, isMember]
    Pack:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: ["string", "null"]
        memberCount:
          type: number
        isPublic:
          type: boolean
      required: [id, name, location, memberCount, isPublic]
    PackRequest:
      type: object
      properties:
        id:
          type: string
        dogId:
          type: string
        status:
          type: string
      required: [id, dogId, status]
    IncomingPackRequest:
      type: object
      properties:
        id:
          type: string
        fromDogName:
          type: string
        toDogName:
          type: string
        message:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, fromDogName, toDogName, message, createdAt]
    PackRequestResponseInput:
      type: object
      properties:
        status:
          type: string
          enum: [accepted, declined]
      required: [status]
    PackRequestResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          type: string
          enum: [accepted, declined]
      required: [success, status]
    AuthCredentials:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
      required: [email, password]
    AuthResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"
        requiresEmailVerification:
          type: boolean
        message:
          type: string
        accessToken:
          type: string
          description: Present only when X-SniffTown-Client is mobile.
        refreshToken:
          type: string
          description: Present only when X-SniffTown-Client is mobile.
      required: [user, requiresEmailVerification, message]
    RefreshSessionInput:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required: [refreshToken]
    CurrentUser:
      type: object
      properties:
        id:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        displayName:
          type: ["string", "null"]
      required: [id, email, displayName]
    ContactMessage:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        message:
          type: string
          minLength: 1
          maxLength: 1000
      required: [name, email, message]
    MessageStatus:
      type: object
      properties:
        accepted:
          type: boolean
        message:
          type: string
      required: [accepted, message]
    ConversationSummary:
      type: object
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        participant1Id:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        participant2Id:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        lastMessageAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        otherDogName:
          type: ["string", "null"]
        otherOwnerName:
          type: ["string", "null"]
        otherDogPhotoUrl:
          type: ["string", "null"]
        otherDogId:
          type: ["string", "null"]
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        otherUserId:
          type: ["string", "null"]
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        lastMessage:
          type: ["string", "null"]
        unreadCount:
          type: number
      required: [id, participant1Id, participant2Id, lastMessageAt, createdAt, otherDogName, otherOwnerName, otherDogPhotoUrl, otherDogId, otherUserId, lastMessage, unreadCount]
    Message:
      type: object
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        senderId:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        receiverId:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        content:
          type: string
        readAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, senderId, receiverId, content, readAt, createdAt]
    MessageInput:
      type: object
      properties:
        receiverId:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        content:
          type: string
          minLength: 1
          maxLength: 2000
      required: [receiverId, content]
    SendMessageResult:
      type: object
      properties:
        conversationId:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        message:
          $ref: "#/components/schemas/Message"
      required: [conversationId, message]
    ConversationReadResult:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

