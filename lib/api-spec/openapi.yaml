openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dogs
    description: Nearby dogs and pack membership
  - name: parks
    description: Nearby parks
  - name: packs
    description: Neighborhood packs
  - name: sitting
    description: Trusted pack pet-sitting exchanges
  - name: auth
    description: Account access and session management
  - name: contact
    description: Contact messages
  - name: messaging
    description: Private member conversations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dogs:
    get:
      operationId: listDogs
      tags: [dogs]
      summary: List nearby dogs
      parameters:
        - name: parkId
          in: query
          required: false
          schema:
            type: string
        - name: nearby
          in: query
          required: false
          description: Return only location-sharing dogs within the signed-in member's radius.
          schema:
            type: boolean
        - name: radiusMiles
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 25
      responses:
        "200":
          description: Nearby dogs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dog"
    post:
      operationId: createDog
      tags: [dogs]
      summary: Add a dog to the community
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DogInput"
      responses:
        "201":
          description: Dog created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dog"
        "401":
          description: Authentication required
  /dogs/location:
    put:
      operationId: updateDogLocation
      tags: [dogs]
      summary: Enable, refresh, or disable nearby discovery for the signed-in member's dog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DogLocationInput"
      responses:
        "200":
          description: Nearby discovery preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DogLocationStatus"
        "401":
          description: Authentication required
        "404":
          description: No dog profile found
  /dogs/mine:
    get:
      operationId: getMyDog
      tags: [dogs]
      summary: Get the signed-in member's primary dog
      responses:
        "200":
          description: Primary dog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dog"
        "401":
          description: Authentication required
        "404":
          description: No dog profile found
    put:
      operationId: updateMyDog
      tags: [dogs]
      summary: Update the signed-in member's primary dog profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DogInput"
      responses:
        "200":
          description: Updated dog profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dog"
        "401":
          description: Authentication required
        "404":
          description: No dog profile found
  /dogs/{dogId}/pack:
    post:
      operationId: addDogToPack
      tags: [dogs]
      summary: Send a pack request to a nearby dog
      parameters:
        - name: dogId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Pack request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRequest"
        "401":
          description: Authentication required
  /parks:
    get:
      operationId: listParks
      tags: [parks]
      summary: List local park packs
      responses:
        "200":
          description: Nearby parks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Park"
    post:
      operationId: createLocalParkPack
      tags: [parks]
      summary: Start a community-created local park pack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocalParkPackInput"
      responses:
        "201":
          description: Local park pack created and joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Park"
        "401":
          description: Authentication required
        "409":
          description: A park pack already exists for this park
  /parks/{parkId}/membership:
    post:
      operationId: updateParkPackMembership
      tags: [parks]
      summary: Join or leave a local park pack
      parameters:
        - name: parkId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParkPackMembershipInput"
      responses:
        "200":
          description: Park pack membership updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkPackMembershipResult"
        "401":
          description: Authentication required
        "404":
          description: Local park pack not found
        "409":
          description: Pack creators must remain members
  /parks/{parkId}:
    get:
      operationId: getParkPackDetail
      tags: [parks]
      summary: Get public park-pack metadata and member-only community content
      parameters:
        - name: parkId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Park-pack detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkPackDetail"
        "404":
          description: Local park pack not found
  /parks/{parkId}/posts:
    post:
      operationId: createParkPackPost
      tags: [parks]
      summary: Create a short post in a park pack board
      parameters:
        - name: parkId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParkPackPostInput"
      responses:
        "201":
          description: Park-pack post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkPackPost"
        "401":
          description: Authentication required
        "403":
          description: Join the park pack before posting
        "404":
          description: Local park pack not found
  /parks/{parkId}/posts/{postId}:
    delete:
      operationId: deleteParkPackPost
      tags: [parks]
      summary: Delete your own park-pack post
      parameters:
        - name: parkId
          in: path
          required: true
          schema:
            type: string
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Park-pack post deleted
        "401":
          description: Authentication required
        "404":
          description: Post not found
  /parks/{parkId}/posts/{postId}/reports:
    post:
      operationId: reportParkPackPost
      tags: [parks]
      summary: Report a visible park-pack post
      description: Available only to signed-in park-pack members. A member may report each post once, with a maximum of five reports per hour.
      parameters:
        - name: parkId
          in: path
          required: true
          schema:
            type: string
        - name: postId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParkPackPostReportInput"
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkPackPostReportResult"
        "401":
          description: Authentication required
        "403":
          description: Join the park pack before reporting
        "404":
          description: Visible post not found in this park pack
        "409":
          description: The member has already reported this post
        "429":
          description: Report rate limit reached
  /parks/{parkId}/moderation/reports:
    get:
      operationId: listParkPackModerationReports
      tags: [parks]
      summary: List open reports for a park pack
      description: Available only to the pack creator or an explicitly designated pack moderator. Reporters' identities are never returned.
      parameters:
        - name: parkId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Up to 50 open reports, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParkPackModerationReport"
        "401":
          description: Authentication required
        "403":
          description: Pack moderator access required
  /parks/{parkId}/moderation/reports/{reportId}:
    post:
      operationId: moderateParkPackPostReport
      tags: [parks]
      summary: Hide a reported post or dismiss its report
      description: Available only to the pack creator or an explicitly designated pack moderator.
      parameters:
        - name: parkId
          in: path
          required: true
          schema:
            type: string
        - name: reportId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParkPackModerationActionInput"
      responses:
        "200":
          description: Report moderated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkPackModerationActionResult"
        "401":
          description: Authentication required
        "403":
          description: Pack moderator access required
        "404":
          description: Open report not found
  /pack-requests/incoming:
    get:
      operationId: listIncomingPackRequests
      tags: [packs]
      summary: List pending pack requests for the signed-in member
      responses:
        "200":
          description: Pending incoming requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IncomingPackRequest"
        "401":
          description: Authentication required
  /pack-requests/{requestId}/response:
    post:
      operationId: respondToPackRequest
      tags: [packs]
      summary: Accept or decline an incoming pack request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackRequestResponseInput"
      responses:
        "200":
          description: Request updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRequestResponse"
        "401":
          description: Authentication required
  /packs:
    get:
      operationId: listPacks
      tags: [packs]
      summary: List public neighborhood packs
      responses:
        "200":
          description: Public neighborhood packs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pack"
  /sitting-requests:
    get:
      operationId: listSittingRequests
      tags: [sitting]
      summary: List pet-sitting requests visible to the signed-in member
      responses:
        "200":
          description: Relevant pet-sitting requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SittingRequest"
        "401":
          description: Authentication required
    post:
      operationId: createSittingRequest
      tags: [sitting]
      summary: Ask trusted pack members for pet-sitting help
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SittingRequestInput"
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SittingRequest"
        "401":
          description: Authentication required
  /sitting-requests/{requestId}/offers:
    post:
      operationId: createSittingOffer
      tags: [sitting]
      summary: Offer to help with a trusted pack request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SittingOfferInput"
      responses:
        "201":
          description: Offer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SittingOffer"
        "401":
          description: Authentication required
  /sitting-requests/{requestId}/offers/{offerId}/accept:
    post:
      operationId: acceptSittingOffer
      tags: [sitting]
      summary: Accept one offer for a pet-sitting request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Offer accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SittingRequest"
        "401":
          description: Authentication required
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create a SniffTown account
      parameters:
        - $ref: "#/components/parameters/SniffTownClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Invalid credentials or existing account
  /auth/signin:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in to SniffTown
      parameters:
        - $ref: "#/components/parameters/SniffTownClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials
  /auth/signout:
    post:
      operationId: signOut
      tags: [auth]
      summary: Sign out
      responses:
        "204":
          description: Signed out
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Refresh a native SniffTown session
      description: Requests that explicitly opt into the mobile bearer-session representation with X-SniffTown-Client set to mobile receive refreshed tokens.
      parameters:
        - $ref: "#/components/parameters/SniffTownClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionInput"
      responses:
        "200":
          description: Refreshed native session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Invalid refresh request
        "401":
          description: Invalid or expired refresh token
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in user
      responses:
        "200":
          description: Current user or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
  /contact:
    post:
      operationId: sendContactMessage
      tags: [contact]
      summary: Send a message to the SniffTown team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessage"
      responses:
        "202":
          description: Message accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageStatus"
  /conversations:
    get:
      operationId: listConversations
      tags: [messaging]
      summary: List the signed-in member's conversations
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
        "401":
          description: Authentication required
  /conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      tags: [messaging]
      summary: List messages in a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "401":
          description: Authentication required
        "404":
          description: Conversation not found
  /messages:
    post:
      operationId: sendMessage
      tags: [messaging]
      summary: Send a private message to a member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResult"
        "400":
          description: Invalid message
        "401":
          description: Authentication required
  /conversations/{conversationId}/read:
    post:
      operationId: markConversationRead
      tags: [messaging]
      summary: Mark received messages in a conversation as read
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      responses:
        "200":
          description: Conversation marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationReadResult"
        "401":
          description: Authentication required
        "404":
          description: Conversation not found
components:
  parameters:
    SniffTownClient:
      name: X-SniffTown-Client
      in: header
      required: false
      description: Opts a request into the mobile bearer-session response representation.
      schema:
        type: string
        enum: [mobile]
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Dog:
      type: object
      properties:
        id:
          type: string
        ownerId:
          type: string
        name:
          type: string
        ownerName:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        dogSex:
          type: ["string", "null"]
          enum: [male, female, unknown, null]
        size:
          type: ["string", "null"]
          enum: [Small, Medium, Large, "Extra large", null]
        temperament:
          type: array
          items:
            type: string
        lookingFor:
          type: array
          items:
            type: string
            enum:
              - dog_walk
              - playdate
              - park_meetup
              - dog_friendly_date
              - friendship
              - regular_walking_buddy
              - dog_sitting_swap
              - occasional_dropoff_help
              - other
        lookingForNote:
          type: ["string", "null"]
        energyLevel:
          type: ["string", "null"]
          enum: [low, medium, high, null]
        playStyles:
          type: array
          items:
            type: string
            enum:
              - likes_to_chase
              - likes_wrestling
              - gentle_play
              - fetch
              - mostly_walking_together
              - prefers_people_to_dogs
              - learning_social_skills
        compatibleWith:
          type: array
          items:
            type: string
            enum:
              - small_dogs
              - medium_dogs
              - large_dogs
              - puppies
              - adult_dogs
              - senior_dogs
              - calm_dogs
              - high_energy_dogs
              - male_dogs
              - female_dogs
              - most_dogs
              - depends_on_the_dog
        notGoodFitWith:
          type: array
          items:
            type: string
            enum:
              - small_dogs
              - large_dogs
              - puppies
              - high_energy_dogs
              - male_dogs
              - female_dogs
              - rough_play
              - no_major_restrictions
        availability:
          type: array
          items:
            type: string
            enum: [morning, midday, afternoon, evening, weekdays, weekends]
        meetupPreferences:
          type: array
          items:
            type: string
            enum:
              - neighborhood_walk
              - park_walk
              - dog_park
              - trail_hike
              - patio_social
        sittingInterests:
          type: array
          items:
            type: string
            enum:
              - a_few_hours
              - half_day
              - full_day
              - overnight
              - trade_sitting_favors
              - paid_sitting_referrals
        parkId:
          type: ["string", "null"]
        isInPack:
          type: boolean
        distanceMiles:
          type: ["number", "null"]
          description: Approximate distance in half-mile increments; exact coordinates are never returned.
        matchExplanation:
          type: ["string", "null"]
          description: A short explanation of why this dog is surfaced; never a numeric compatibility score.
      required: [id, ownerId, name, ownerName, description, photoUrl, dogSex, size, temperament, lookingFor, lookingForNote, energyLevel, playStyles, compatibleWith, notGoodFitWith, availability, meetupPreferences, sittingInterests, parkId, isInPack, distanceMiles, matchExplanation]
    DogLocationInput:
      type: object
      properties:
        enabled:
          type: boolean
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      required: [enabled]
    DogLocationStatus:
      type: object
      properties:
        enabled:
          type: boolean
      required: [enabled]
    DogInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        dogSex:
          type: ["string", "null"]
          enum: [male, female, unknown, null]
        size:
          type: ["string", "null"]
          enum: [Small, Medium, Large, "Extra large", null]
        temperament:
          type: array
          items:
            type: string
        lookingFor:
          type: array
          items:
            type: string
            enum:
              - dog_walk
              - playdate
              - park_meetup
              - dog_friendly_date
              - friendship
              - regular_walking_buddy
              - dog_sitting_swap
              - occasional_dropoff_help
              - other
        lookingForNote:
          type: ["string", "null"]
          maxLength: 240
        energyLevel:
          type: ["string", "null"]
          enum: [low, medium, high, null]
        playStyles:
          type: array
          items:
            type: string
            enum:
              - likes_to_chase
              - likes_wrestling
              - gentle_play
              - fetch
              - mostly_walking_together
              - prefers_people_to_dogs
              - learning_social_skills
        compatibleWith:
          type: array
          items:
            type: string
            enum:
              - small_dogs
              - medium_dogs
              - large_dogs
              - puppies
              - adult_dogs
              - senior_dogs
              - calm_dogs
              - high_energy_dogs
              - male_dogs
              - female_dogs
              - most_dogs
              - depends_on_the_dog
        notGoodFitWith:
          type: array
          items:
            type: string
            enum:
              - small_dogs
              - large_dogs
              - puppies
              - high_energy_dogs
              - male_dogs
              - female_dogs
              - rough_play
              - no_major_restrictions
        availability:
          type: array
          items:
            type: string
            enum: [morning, midday, afternoon, evening, weekdays, weekends]
        meetupPreferences:
          type: array
          items:
            type: string
            enum:
              - neighborhood_walk
              - park_walk
              - dog_park
              - trail_hike
              - patio_social
        sittingInterests:
          type: array
          items:
            type: string
            enum:
              - a_few_hours
              - half_day
              - full_day
              - overnight
              - trade_sitting_favors
              - paid_sitting_referrals
        parkId:
          type: ["string", "null"]
      required: [name]
    Park:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        city:
          type: string
        state:
          type: string
        slug:
          type: string
        address:
          type: ["string", "null"]
        offLeash:
          type: boolean
        communityCreated:
